version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smartmoney-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: smartmoney
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - smartmoney-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmoney-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/smartmoney?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      MISTA_API_URL: https://api.mista.io
      MISTA_API_KEY: ${MISTA_API_KEY}
      MISTA_SENDER_ID: ${MISTA_SENDER_ID}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - smartmoney-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartmoney-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_APP_NAME: FinController
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - smartmoney-network
    command: npm run dev

  redis:
    image: redis:7-alpine
    container_name: smartmoney-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartmoney-network

volumes:
  mongodb_data:
  redis_data:

networks:
  smartmoney-network:
    driver: bridge


