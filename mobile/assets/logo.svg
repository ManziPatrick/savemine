<!-- Simple SVG Logo with S and M for SmartMoney -->
<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="#059669"/>
  
  <!-- S Letter -->
  <text x="512" y="480" font-family="Arial, sans-serif" font-size="320" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  
  <!-- M Letter -->
  <text x="512" y="700" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#ffffff" text-anchor="middle">M</text>
</svg>

